<script>
(function () {
  const TARGET = "https://t.me/+dwow3XCnuFZkNmE1";
  let secs = 40;
  let redirectDone = false;

  const timer = setInterval(function () {
    secs--;

    const timerEl = document.getElementById("timer");
    if (timerEl) timerEl.textContent = secs;

    if (secs <= 0 && !redirectDone) {
      redirectDone = true;
      clearInterval(timer);

      setTimeout(function () {
        window.location.href = TARGET;
      }, 400);
    }
  }, 1000);

  function redirectToTelegram(e) {
    if (e) e.preventDefault();

    redirectDone = true;
    clearInterval(timer);

    setTimeout(function () {
      window.location.href = TARGET;
    }, 400);
  }

  const topBtn = document.getElementById("topCta");
  const mainBtn = document.getElementById("mainCta");

  if (topBtn) topBtn.addEventListener("click", redirectToTelegram);
  if (mainBtn) mainBtn.addEventListener("click", redirectToTelegram);

  const memberEl = document.getElementById("memberCount");
  let count = 2845;

  setInterval(function () {
    count += Math.random() > 0.4 ? 1 : -1;

    if (count < 2800) count = 2800;

    if (memberEl) {
      memberEl.textContent = count.toLocaleString("en-IN");
    }
  }, 3000);
})();
</script>
