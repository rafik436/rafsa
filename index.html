<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at top,#4a3600 0%,#171000 45%,#080600 100%);
  color:#fff;
}

.card{
  width:92%;
  max-width:420px;
  padding:30px 22px;
  text-align:center;
  border-radius:25px;
  background:linear-gradient(145deg,#211900,#0d0b03);
  border:1px solid #d4af37;
  box-shadow:
    0 0 25px rgba(212,175,55,.35),
    inset 0 0 25px rgba(212,175,55,.05);
}

.logo{
  width:82px;
  height:82px;
  margin:0 auto 18px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(145deg,#ffe68a,#b8860b);
  color:#1b1300;
  font-size:35px;
  font-weight:bold;
  box-shadow:0 0 25px rgba(255,215,0,.55);
}

h1{
  font-size:29px;
  color:#f5d76e;
  margin-bottom:8px;
}

.subtitle{
  color:#d7d0bd;
  font-size:15px;
  line-height:1.6;
}

.members{
  margin:22px 0;
  padding:15px;
  border-radius:16px;
  background:rgba(212,175,55,.10);
  border:1px solid rgba(212,175,55,.35);
}

.members span{
  color:#cfc3a0;
  font-size:13px;
}

.members b{
  display:block;
  margin-top:5px;
  color:#ffd95a;
  font-size:25px;
}

.timerBox{
  margin:18px 0;
  color:#ddd;
  font-size:16px;
}

#timer{
  display:inline-block;
  margin-top:5px;
  font-size:42px;
  font-weight:bold;
  color:#ffd54f;
}

.btn{
  display:block;
  width:100%;
  padding:16px;
  margin-top:12px;
  border-radius:15px;
  text-decoration:none;
  color:#171000;
  font-size:17px;
  font-weight:bold;
  background:linear-gradient(
    90deg,
    #d4af37,
    #ffe082,
    #d4af37
  );
  box-shadow:0 8px 22px rgba(212,175,55,.35);
}

.btn:active{
  transform:scale(.98);
}

.footer{
  margin-top:20px;
  color:#927b3c;
  font-size:13px;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">R</div>

  <h1>TEAM RAFSA</h1>

  <p class="subtitle">
    Welcome to our official Telegram community.
  </p>

  <div class="members">
    <span>Community Members</span>
    <b id="memberCount">2,845</b>
  </div>

  <div class="timerBox">
    Redirecting in
    <br>
    <span id="timer">5</span>
    Seconds
  </div>

  <a
    id="telegramBtn"
    class="btn"
    href="https://t.me/+dwow3XCnuFZkNmE1"
  >
    JOIN TELEGRAM
  </a>

  <div class="footer">
    © 2026 Team RAFSA
  </div>

</div>

<script>

const TARGET =
"https://t.me/+dwow3XCnuFZkNmE1";

let seconds = 15;
let redirected = false;

const timer =
document.getElementById("timer");

const interval = setInterval(function(){

  seconds--;

  timer.textContent = seconds;

  if(seconds <= 0 && !redirected){

    redirected = true;

    clearInterval(interval);

    window.location.href = TARGET;
  }

},1000);


/* TELEGRAM BUTTON */

document
.getElementById("telegramBtn")
.addEventListener("click",function(){

  redirected = true;

  clearInterval(interval);

});


/* MEMBER DISPLAY */

let count = 2845;

setInterval(function(){

  count += Math.random() > .4 ? 1 : -1;

  if(count < 2800){
    count = 2800;
  }

  document
  .getElementById("memberCount")
  .textContent =
  count.toLocaleString("en-IN");

},3000);

</script>

</body>
</html>
